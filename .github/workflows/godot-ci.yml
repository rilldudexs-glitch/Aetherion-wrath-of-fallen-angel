name: Godot 4.3 CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.gd"
      - "**.tscn"
      - "**.tres"
      - "**.godot"
      - "project.godot"
      - ".github/workflows/godot-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
          sudo install /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Import project resources
        run: godot --headless --editor --path . --import --quit

      - name: Launch project headlessly
        run: godot --headless --path . --quit-after 3

      - name: Upload Godot cache and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aetherion-godot-ci-logs
          path: |
            .godot/
            ~/.local/share/godot/app_userdata/
          if-no-files-found: ignore
