name: Godot 4.3 CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.gd"
      - "**.tscn"
      - "**.tres"
      - "**.glb"
      - "**.godot"
      - "project.godot"
      - ".github/workflows/godot-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
          sudo install /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Import resources and parse project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --import --quit 2>&1 | tee import.log

      - name: Validate every scene resource
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/validate_scenes.gd 2>&1 | tee scene_validation.log

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri

      - name: Run main scene with Compatibility renderer
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 godot --path . --rendering-method gl_compatibility --audio-driver Dummy --script res://tests/runtime_smoke.gd 2>&1 | tee runtime.log
          # Godot reports one retained script-runner resource during orderly --script shutdown.
          # Keep parser, runtime, and all other engine errors fatal.
          # Headless editor import can emit a harmless Dummy-renderer null-mesh diagnostic; the Compatibility runtime smoke remains the rendering check.
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" import.log scene_validation.log runtime.log | grep -v "ERROR: 1 resources still in use at exit" | grep -v 'ERROR: Parameter "m" is null.'; then
            echo "Godot reported errors; see logs above."
            exit 1
          fi

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aetherion-godot-diagnostics
          path: |
            import.log
            runtime.log
            scene_validation.log
            .godot/
          if-no-files-found: ignore
